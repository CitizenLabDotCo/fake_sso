version: 2.1

jobs:
  build-and-push:
    docker:
      - image: cimg/base:2025.01
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build and push fake-sso image
          command: |
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
            docker buildx create --use
            docker buildx build \
              --platform linux/amd64 \
              --tag citizenlabdotco/fake-sso:latest \
              --tag "citizenlabdotco/fake-sso:$CIRCLE_SHA1" \
              --push \
              .

workflows:
  version: 2
  build-deploy:
    jobs:
      - build-and-push:
          context: docker-hub-access
          filters:
            branches:
              only: main
